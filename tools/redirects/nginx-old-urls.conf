location = /who-we-are/career-page/ { return 301 /careers.html; }
location = /who-we-are/board-of-directors { return 301 /board-of-directors.html; }
location = /who-we-are/board-of-directors/ { return 301 /board-of-directors.html; }
location = /no-title { return 301 /bpso.html; }
location = /no-title/ { return 301 /bpso.html; }
